services:
  postgres:
    image: postgres:16-alpine
    container_name: vale-postgres
    environment:
      POSTGRES_USER: vale
      POSTGRES_PASSWORD: vale
      POSTGRES_DB: vale_project
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432'
    volumes:
      - vale-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vale -d vale_project']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: node:22-bookworm-slim
    working_dir: /workspace
    env_file:
      - .env
    environment: &app-environment
      NODE_ENV: development
      API_PORT: 3001
      API_CORS_ORIGIN: http://localhost:${WEB_HOST_PORT:-3000}
      WEB_APP_URL: http://localhost:${WEB_HOST_PORT:-3000}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: vale
      DATABASE_PASSWORD: vale
      DATABASE_NAME: vale_project
      DATABASE_SSL_MODE: disable
      JWT_ACCESS_SECRET: dev-access-secret-change-before-production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_HOST_PORT:-3001}
    volumes: &app-volumes
      - .:/workspace
      - vale-node-modules:/workspace/node_modules
      - vale-pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter @vale/api migration:run"
    restart: 'no'

  api:
    image: node:22-bookworm-slim
    working_dir: /workspace
    env_file:
      - .env
    environment: *app-environment
    volumes: *app-volumes
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3001}:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: >-
      sh -c "corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter @vale/api dev"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3001/health/live\").then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: node:22-bookworm-slim
    working_dir: /workspace
    env_file:
      - .env
    environment:
      <<: *app-environment
      HOSTNAME: 0.0.0.0
    volumes: *app-volumes
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    command: >-
      sh -c "corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter @vale/web dev"

  db-reset:
    image: node:22-bookworm-slim
    working_dir: /workspace
    env_file:
      - .env
    environment:
      <<: *app-environment
      DEV_DB_RESET_CONFIRM: 'true'
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter @vale/api db:reset:dev"
    profiles: ['maintenance']
    restart: 'no'

  db-reseed:
    image: node:22-bookworm-slim
    working_dir: /workspace
    env_file:
      - .env
    environment:
      <<: *app-environment
      DEV_DB_RESET_CONFIRM: 'true'
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter @vale/api db:reset:dev"
    profiles: ['maintenance']
    restart: 'no'

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vale_test
      POSTGRES_PASSWORD: vale_test
      POSTGRES_DB: vale_project_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vale_test -d vale_project_test']
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  vale-node-modules:
  vale-pnpm-store:
  vale-postgres-data:
